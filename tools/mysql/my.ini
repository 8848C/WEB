# ---------------------------------------------------------------------------
# 项目自带的 MySQL 开发实例（不依赖 Windows 服务，不碰你机器上已有的 MySQL）
#
#   数据目录 : D:/KunHome/kun-login/.mysql/data
#   监听端口 : 3307  (避开系统里 MySQL6767 服务占用的 3306)
#
# 启动:  tools\start-mysql.ps1
# 停止:  tools\stop-mysql.ps1
# ---------------------------------------------------------------------------

[client]
port=3307
host=127.0.0.1
default-character-set=utf8mb4

[mysql]
no-beep
default-character-set=utf8mb4

[mysqld]
basedir=D:/MySQL
datadir=D:/KunHome/kun-login/.mysql/data
port=3307
bind-address=127.0.0.1
mysqlx=0

character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci
default-storage-engine=INNODB
lower_case_table_names=1

# 开发实例不需要主从复制日志
skip-log-bin

# 日志与 pid 都放在项目内，方便排查
log-error=D:/KunHome/kun-login/.mysql/logs/mysqld.err
pid-file=D:/KunHome/kun-login/.mysql/mysqld.pid

# 注意：这里**不能**开 skip-name-resolve。
# 初始化时只会创建 root@localhost，而 127.0.0.1 -> localhost 的反向解析
# 依赖名称解析；关掉它就会出现 ERROR 1130 (Host '127.0.0.1' is not allowed)。

max_connections=100
innodb_buffer_pool_size=256M
innodb_flush_log_at_trx_commit=2
